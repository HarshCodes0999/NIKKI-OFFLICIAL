<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | NIKKI AI</title>

<link rel="stylesheet" href="Profile.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- Background -->

<div class="background">

<div class="grid"></div>

<div class="glow glow-blue"></div>

<div class="glow glow-purple"></div>

</div>

<div class="profile-container">

<div class="profile-card">

<div class="profile-image">

<img src="assets/profile.png" alt="Profile" id="profilePhoto">

</div>

<h1 id="userName">Loading...</h1>

<p style="color:#9db7ff;margin-top:10px;">
NIKKI AI User
</p>

<!-- User Information -->

<div class="profile-info">

<div class="info-card">

<div class="info-title">
<i class="fa-solid fa-user"></i>
 Full Name
</div>

<div class="info-value" id="profileName">
Loading...
</div>

</div>

<div class="info-card">

<div class="info-title">
<i class="fa-solid fa-envelope"></i>
 Email Address
</div>

<div class="info-value" id="profileEmail">
Loading...
</div>

</div>

<div class="info-card">

<div class="info-title">
<i class="fa-solid fa-id-card"></i>
 User ID
</div>

<div class="info-value" id="profileUID">
Loading...
</div>

</div>

<div class="info-card">

<div class="info-title">
<i class="fa-solid fa-calendar-days"></i>
 Account Created
</div>

<div class="info-value" id="profileCreated">
Loading...
</div>

</div>

</div>

<!-- Buttons -->

<div class="profile-buttons">

<button class="profile-btn" id="editProfileBtn">

<i class="fa-solid fa-pen"></i>
 Edit Profile

</button>

<button class="profile-btn"
onclick="location.href='Dashboard.html'">

<i class="fa-solid fa-house"></i>
 Dashboard

</button>

<button class="profile-btn logout-btn"
id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>
 Logout

</button>

</div>

  <!-- Footer -->

<footer class="profile-footer">

<div class="footer-logo">

<img src="assets/LOGO.png" alt="NIKKI Logo">

<h2>NIKKI AI</h2>

<p>Neural Intelligent Knowledge Kernel Interface</p>

</div>

<p class="footer-text">

Your secure AI profile powered by Firebase Authentication.

</p>

<div class="footer-buttons">

<a href="Dashboard.html" class="footer-btn">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

<a href="About.html" class="footer-btn">

<i class="fa-solid fa-circle-info"></i>

About

</a>

</div>

<div class="copyright">

Copyright © 2026 NIKKI. All Rights Reserved.

</div>

</footer>

</div>
<!-- End Profile Card -->

</div>
<!-- End Profile Container -->

<script type="module" src="Profile.js"></script>

</body>

</html>
